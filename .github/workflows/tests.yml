name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.3 check qmm tests demo.py
      - run: uvx ruff@0.17.3 format --check qmm tests demo.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", numpy: "numpy==1.19.5" }
          - { python: "3.9", numpy: "numpy<3" }
          - { python: "3.12", numpy: "numpy==1.26.4" }
          - { python: "3.14", numpy: "numpy<3" }
          - { python: "3.15", numpy: "numpy<3" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run tests
        run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with "${{ matrix.numpy }}" --with pytest pytest
